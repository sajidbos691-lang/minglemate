
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ipcfenbbijhyqsbqwbew.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_aifs2SZF3su2GLyGnanfHA__2JisBbf';

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const modal = document.getElementById('joinModal');

document.querySelectorAll('[data-open]').forEach(button => {
  button.addEventListener('click', () => {
    modal.classList.add('show');
    document.getElementById('displayName').focus();
  });
});

function closeModal() {
  modal.classList.remove('show');
}

document.getElementById('closeModal')
  .addEventListener('click', closeModal);

modal.addEventListener('click', event => {
  if (event.target === modal) closeModal();
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeModal();
});

document.getElementById('joinForm').addEventListener('submit', async event => {
  event.preventDefault();

  const feedback = document.getElementById('formFeedback');
  const button = event.currentTarget.querySelector('button[type="submit"]');

  const displayName = document.getElementById('displayName').value.trim();
  const country = document.getElementById('country').value;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  feedback.style.color = '#a13d4c';
  feedback.textContent = 'Creating your account...';
  button.disabled = true;

  try {
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        data: {
          display_name: displayName,
          country: country
        }
      }
    });

    if (error) throw error;

    feedback.style.color = '#168363';
    feedback.textContent = data.user && !data.session
      ? 'Account created! Please check your email to confirm your account.'
      : 'Account created successfully!';

    event.currentTarget.reset();

  } catch (error) {
    feedback.textContent = error.message || 'Signup failed. Please try again.';
  } finally {
    button.disabled = false;
  }
});
</script>
